<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>Лабораторная работа по математическому моделированию</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background: #f5f5f5;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		header {
			background: #2c3e50;
			color: #fff;
			padding: 12px 20px;
		}
		header h1 {
			margin: 0 0 4px 0;
			font-size: 18px;
			font-weight: 600;
		}
		header p {
			margin: 0;
			font-size: 13px;
			opacity: 0.8;
		}
		nav {
			background: #34495e;
			display: flex;
			border-bottom: 2px solid #1abc9c;
		}
		nav button {
			background: transparent;
			color: #ecf0f1;
			border: none;
			padding: 12px 24px;
			font-size: 14px;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			transition: background 0.15s, border-color 0.15s;
		}
		nav button:hover {
			background: rgba(255, 255, 255, 0.08);
		}
		nav button.active {
			background: #1abc9c;
			border-bottom-color: #16a085;
		}
		.frame-wrap {
			flex: 1;
			background: #fff;
			overflow: hidden;
		}
		iframe {
			width: 100%;
			height: 100%;
			border: 0;
			display: block;
		}
	</style>
</head>
<body>
	<header>
		<h1>Лабораторная работа по математическому моделированию</h1>
		<p>КБИП — Клименко Д. Ф. Реализация алгоритмов поиска кратчайшего пути.</p>
	</header>
	<nav>
		<button data-src="dex.html" class="active">Алгоритм Дейкстры</button>
		<button data-src="ford.html">Алгоритм Беллмана — Форда</button>
	</nav>
	<div class="frame-wrap">
		<iframe id="content" src="dex.html" title="Алгоритм"></iframe>
	</div>
	<script>
		var buttons = document.querySelectorAll('nav button');
		var frame = document.getElementById('content');
		buttons.forEach(function (btn) {
			btn.addEventListener('click', function () {
				buttons.forEach(function (b) { b.classList.remove('active'); });
				btn.classList.add('active');
				frame.src = btn.getAttribute('data-src');
			});
		});
	</script>
</body>
</html>
